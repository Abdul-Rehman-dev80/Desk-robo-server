name: xiaozhi

on:
  push:
    branches: [main]
    paths: ["xiaozhi/**", ".github/workflows/xiaozhi.yml"]
  pull_request:
    paths: ["xiaozhi/**", ".github/workflows/xiaozhi.yml"]
  workflow_dispatch:
    inputs:
      backtrace:
        description: "Crash backtrace from the serial log (e.g. 0x4037CA0A:0x3FCA04A0 ...); decoded against this build"
        required: false
        default: ""

jobs:
  build:
    name: Build ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [digilog-s3cam-oled, digilog-s3cam-oled-sh1106]
    runs-on: ubuntu-latest
    # Same ESP-IDF version the original Digilog firmware was built with
    container:
      image: espressif/idf:v6.1
    defaults:
      run:
        working-directory: xiaozhi
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py digilog-s3cam-oled --name ${{ matrix.variant }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          # One file to flash at address 0x0 (see xiaozhi/main/boards/digilog-s3cam-oled/README.md)
          name: ${{ matrix.variant }}-merged-binary
          path: xiaozhi/build/merged-binary.bin
          if-no-files-found: error

      - name: Upload ELF (for decoding crash backtraces)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-elf
          path: xiaozhi/build/xiaozhi.elf
          retention-days: 7
          if-no-files-found: warn

      - name: Decode backtrace
        if: ${{ inputs.backtrace != '' }}
        shell: bash
        env:
          BACKTRACE: ${{ inputs.backtrace }}
        run: |
          source $IDF_PATH/export.sh
          pcs=$(echo "$BACKTRACE" | tr ' ' '\n' | cut -d: -f1 | grep -E '^0x[0-9a-fA-F]+$' | tr '\n' ' ')
          xtensa-esp32s3-elf-addr2line -pfiaC -e build/xiaozhi.elf $pcs
